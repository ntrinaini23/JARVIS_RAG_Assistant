version: '3.8'

services:
  backend:
    build:
      context: ./jarvis-rag-ai/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./jarvis-rag-ai/backend/data:/app/data
      - ./jarvis-rag-ai/backend/chroma_db:/app/chroma_db
    environment:
      - JARVIS_OLLAMA_HOST=http://host.docker.internal:11434
      - JARVIS_DEFAULT_LLM_MODEL=qwen2.5:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  frontend:
    build:
      context: ./jarvis-rag-ai/frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always
